<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Premium Jathagam Kattam</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-gradient-to-b from-purple-900 via-indigo-900 to-black text-white flex flex-col items-center p-6">

<h1 class="text-4xl md:text-6xl font-bold mb-6 bg-gradient-to-r from-yellow-400 to-pink-500 bg-clip-text text-transparent">
    Premium Jathagam Kattam
</h1>

<form action="/generate" method="post" class="w-full max-w-lg p-6 bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl shadow-xl space-y-4">
    <input type="text" name="name" placeholder="Full Name" required class="w-full p-2 rounded bg-white/20 text-white placeholder-gray-300">
    <label for="dob" class="block text-white mb-2">Date of Birth</label>
    <input type="date" id="dob" name="dob" required class="w-full p-2 rounded bg-white/20 text-white" title="Date of Birth" placeholder="YYYY-MM-DD">
    <input type="time" name="tob" required class="w-full p-2 rounded bg-white/20 text-white">
    <input type="text" name="place" placeholder="Place of Birth" required class="w-full p-2 rounded bg-white/20 text-white placeholder-gray-300">
    <button type="submit" class="w-full py-2 rounded bg-gradient-to-r from-yellow-400 to-pink-500 text-black font-semibold">
        Generate Jathagam
    </button>
</form>

</body>
</html>
